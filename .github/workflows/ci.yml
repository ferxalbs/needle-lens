name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium for CI smoke tests
        run: bunx playwright install --with-deps chromium
      - name: Lint source policy
        run: bun run lint
      - name: Verify compile, tests, build, manifest, and budgets
        run: bun run verify
      - name: Verify extension smoke flow
        run: bun run test:e2e
